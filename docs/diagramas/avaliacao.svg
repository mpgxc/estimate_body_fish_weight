<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 744" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">

  <style>
    .flow { fill: none; stroke-width: 1.5; stroke-dasharray: 4 14; animation: flow 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } .token { display: none; } }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#a8a29a"/></marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#7a7a82"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#1a9970"/></marker>
    <marker id="arrow-coral" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#b5432a"/></marker>
  </defs>

  <rect width="880" height="744" fill="#ffffff"/>

  <text x="440" y="44" fill="#8a8a8a" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.12em" style="text-transform:uppercase">como cada técnica é medida</text>

  <!-- escopos -->
  <rect x="200" y="320" width="480" height="280" rx="12" fill="none" stroke="#8b7fd4" stroke-width="1.25" stroke-dasharray="6,5"/>
  <rect x="218" y="312" width="66.7" height="16" fill="#ffffff"/>
  <text x="222" y="324" fill="#8b7fd4" font-size="11" font-weight="600">uma dobra</text>

  <!-- conectores -->
  <path id="a-peixes-divisao" d="M 440 136 L 440 200" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-divisao-treino" d="M 440 272 L 440 352" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-treino-teste" d="M 440 424 L 440 496" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-teste-metricas" d="M 440 568 L 440 648" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-proxima" d="M 320 532 C 60 520, 60 250, 320 236" stroke="#1a9970" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- fluxo (para 8 px antes da ponta) -->
  <path class="flow" d="M 440 136 L 440 192" stroke="#7a7a82"/>
  <path class="flow" d="M 440 272 L 440 344" stroke="#7a7a82"/>
  <path class="flow" d="M 440 424 L 440 488" stroke="#7a7a82"/>
  <path class="flow" d="M 440 568 L 440 640" stroke="#7a7a82"/>

  <!-- rótulos das setas -->
  <rect x="458.25" y="453" width="103.5" height="15" fill="#ffffff"/>
  <text x="510" y="464" fill="#8a8a8a" font-size="11" text-anchor="middle">modelo ajustado</text>
  <rect x="456.6" y="615" width="182.8" height="15" fill="#ffffff"/>
  <text x="548" y="626" fill="#8a8a8a" font-size="11" text-anchor="middle">predições de todas as dobras</text>
  <rect x="18.35" y="377" width="91.3" height="15" fill="#ffffff"/>
  <text x="64" y="388" fill="#1a9970" font-size="11" font-weight="600" text-anchor="middle">próxima dobra</text>

  <!-- blocos -->
  <rect x="320" y="80" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="320" y="80" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="440" y="113" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">244 peixes</text>

  <rect x="320" y="200" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="320" y="200" width="240" height="72" rx="10" fill="#e1f4ee" stroke="#9dd3c2" stroke-width="1.25"/>
  <text x="440" y="232" fill="#1f6a56" font-size="15" font-weight="500" text-anchor="middle">divisão em dobras</text>
  <text x="440" y="250" fill="#2f8a72" font-size="11" font-weight="500" text-anchor="middle">P1 · P2 · P3, fixas em arquivo</text>

  <rect x="320" y="352" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="320" y="352" width="240" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="440" y="384" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">treino</text>
  <text x="440" y="402" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">o modelo vê foto, máscara e peso</text>

  <rect x="320" y="496" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="320" y="496" width="240" height="72" rx="10" fill="#e1f4ee" stroke="#9dd3c2" stroke-width="1.25"><animate attributeName="stroke-width" values="1.25;2.5;1.25" dur="0.6s" begin="t2_0.end"/></rect>
  <text x="440" y="528" fill="#1f6a56" font-size="15" font-weight="500" text-anchor="middle">teste</text>
  <text x="440" y="546" fill="#2f8a72" font-size="11" font-weight="500" text-anchor="middle">o peso fica escondido do modelo</text>

  <rect x="320" y="648" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="320" y="648" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="440" y="681" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">MAE · RMSE · MAPE · R²</text>

  <!-- pontos: percorrem os conectores em sequência e descansam 1 s -->
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t0_0" dur="0.90s" begin="0.4s; t4_0.end+1s"><mpath href="#a-peixes-divisao"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.90s" begin="t0_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t1_0" dur="1.07s" begin="t0_0.end"><mpath href="#a-divisao-treino"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.07s" begin="t1_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t2_0" dur="0.96s" begin="t1_0.end"><mpath href="#a-treino-teste"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t2_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#1a9970" opacity="0">
    <animateMotion id="t3_0" dur="7.21s" begin="t2_0.end"><mpath href="#a-proxima"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="7.21s" begin="t3_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t4_0" dur="1.07s" begin="t3_0.end"><mpath href="#a-teste-metricas"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.07s" begin="t4_0.begin"/>
  </circle>

</svg>
