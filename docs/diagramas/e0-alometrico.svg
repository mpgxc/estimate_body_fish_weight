<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">

  <style>
    .flow { fill: none; stroke-width: 1.5; stroke-dasharray: 4 14; animation: flow 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } .token { display: none; } }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#a8a29a"/></marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#7a7a82"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#1a9970"/></marker>
    <marker id="arrow-coral" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#b5432a"/></marker>
  </defs>

  <rect width="900" height="576" fill="#ffffff"/>

  <text x="450" y="44" fill="#8a8a8a" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.12em" style="text-transform:uppercase">E0 · piso alométrico</text>

  <!-- conectores -->
  <path id="a-mascara-medida" d="M 450 136 L 450 200" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-medida-modelo" d="M 450 272 L 450 336" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-modelo-peso" d="M 450 408 L 450 480" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-especie-modelo" d="M 710 372 L 590 372" stroke="#7a7a82" stroke-width="1.25" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-dash)"/>

  <!-- fluxo (para 8 px antes da ponta) -->
  <path class="flow" d="M 450 136 L 450 192" stroke="#7a7a82"/>
  <path class="flow" d="M 450 272 L 450 328" stroke="#7a7a82"/>
  <path class="flow" d="M 450 408 L 450 472" stroke="#7a7a82"/>

  <!-- rótulos das setas -->
  <rect x="595.2" y="349" width="109.6" height="15" fill="#ffffff"/>
  <text x="650" y="360" fill="#8a8a8a" font-size="11" text-anchor="middle">a, b por espécie</text>

  <!-- blocos -->
  <rect x="330" y="80" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="330" y="80" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="450" y="113" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">máscara do peixe</text>

  <rect x="330" y="200" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="330" y="200" width="240" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="450" y="232" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">área</text>
  <text x="450" y="250" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">pixels do corpo</text>

  <rect x="310" y="336" width="280" height="72" rx="10" fill="#ffffff"/>
  <rect x="310" y="336" width="280" height="72" rx="10" fill="#e7f1fb" stroke="#a8c8e8" stroke-width="1.25"><animate attributeName="stroke-width" values="1.25;2.5;1.25" dur="0.6s" begin="t1_0.end"/></rect>
  <text x="450" y="368" fill="#2a5580" font-size="15" font-weight="500" text-anchor="middle">peso = a × áreaᵇ</text>
  <text x="450" y="386" fill="#3a70a8" font-size="11" font-weight="500" text-anchor="middle">2 coeficientes, ajustados no treino</text>

  <rect x="710" y="336" width="170" height="72" rx="10" fill="#ffffff"/>
  <rect x="710" y="336" width="170" height="72" rx="10" fill="#faede7" stroke="#e0b3a0" stroke-width="1.25"/>
  <text x="795" y="368" fill="#9a4a30" font-size="15" font-weight="500" text-anchor="middle">espécie anotada</text>
  <text x="795" y="386" fill="#b85e40" font-size="11" font-weight="500" text-anchor="middle">variante de referência</text>

  <rect x="330" y="480" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="330" y="480" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="450" y="513" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">peso em gramas</text>

  <!-- pontos: percorrem os conectores em sequência e descansam 1 s -->
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t0_0" dur="0.90s" begin="0.4s; t2_0.end+1s"><mpath href="#a-mascara-medida"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.90s" begin="t0_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#7a7a82" opacity="0">
    <animateMotion id="t1_0" dur="1.60s" begin="t0_0.end"><mpath href="#a-especie-modelo"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.60s" begin="t1_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t1_1" dur="0.90s" begin="t0_0.end"><mpath href="#a-medida-modelo"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.90s" begin="t1_1.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t2_0" dur="0.96s" begin="t1_0.end"><mpath href="#a-modelo-peso"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t2_0.begin"/>
  </circle>

</svg>
