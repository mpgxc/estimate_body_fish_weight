<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 616" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">

  <style>
    .flow { fill: none; stroke-width: 1.5; stroke-dasharray: 4 14; animation: flow 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } .token { display: none; } }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#a8a29a"/></marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#7a7a82"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#1a9970"/></marker>
    <marker id="arrow-coral" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#b5432a"/></marker>
  </defs>

  <rect width="1000" height="616" fill="#ffffff"/>

  <text x="500" y="44" fill="#8a8a8a" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.12em" style="text-transform:uppercase">E2 · regressão direta da foto</text>

  <!-- escopos -->
  <rect x="106" y="184" width="288" height="272" rx="12" fill="none" stroke="#8b7fd4" stroke-width="1.25" stroke-dasharray="6,5"/>
  <rect x="124" y="176" width="66.7" height="16" fill="#ffffff"/>
  <text x="128" y="188" fill="#8b7fd4" font-size="11" font-weight="600">congelada</text>
  <rect x="606" y="184" width="288" height="272" rx="12" fill="none" stroke="#3a6ea8" stroke-width="1.25" stroke-dasharray="6,5"/>
  <rect x="624" y="176" width="79.3" height="16" fill="#ffffff"/>
  <text x="628" y="188" fill="#3a6ea8" font-size="11" font-weight="600">ajuste fino</text>

  <!-- conectores -->
  <path id="a-foto-congelada" d="M 380 108 C 290 108, 250 140, 250 216" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-foto-ajuste" d="M 620 108 C 710 108, 750 140, 750 216" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-congelada-ridge" d="M 250 288 L 250 360" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-ajuste-saida" d="M 750 288 L 750 360" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-ridge-peso" d="M 250 432 C 250 510, 310 548, 380 548" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-saida-peso" d="M 750 432 C 750 510, 690 548, 620 548" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- fluxo (para 8 px antes da ponta) -->
  <path class="flow" d="M 250 288 L 250 352" stroke="#7a7a82"/>
  <path class="flow" d="M 750 288 L 750 352" stroke="#7a7a82"/>

  <!-- rótulos das setas -->
  <rect x="266.75" y="317" width="42.5" height="15" fill="#ffffff"/>
  <text x="288" y="328" fill="#8a8a8a" font-size="11" text-anchor="middle">vetor</text>

  <!-- blocos -->
  <rect x="380" y="80" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="380" y="80" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="500" y="113" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">foto</text>

  <rect x="130" y="216" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="130" y="216" width="240" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="250" y="248" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">rede pré-treinada</text>
  <text x="250" y="266" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">não é treinada · gera um vetor</text>

  <rect x="130" y="360" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="130" y="360" width="240" height="72" rx="10" fill="#e7f1fb" stroke="#a8c8e8" stroke-width="1.25"/>
  <text x="250" y="392" fill="#2a5580" font-size="15" font-weight="500" text-anchor="middle">Ridge ou rede simples</text>
  <text x="250" y="410" fill="#3a70a8" font-size="11" font-weight="500" text-anchor="middle">ajustado sobre os vetores</text>

  <rect x="630" y="216" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="630" y="216" width="240" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="750" y="248" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">rede inteira treinada</text>
  <text x="750" y="266" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">30 épocas · perda Huber</text>

  <rect x="630" y="360" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="630" y="360" width="240" height="72" rx="10" fill="#e7f1fb" stroke="#a8c8e8" stroke-width="1.25"/>
  <text x="750" y="392" fill="#2a5580" font-size="15" font-weight="500" text-anchor="middle">saída de peso</text>
  <text x="750" y="410" fill="#3a70a8" font-size="11" font-weight="500" text-anchor="middle">em gramas ou em logaritmo</text>

  <rect x="380" y="520" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="380" y="520" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"><animate attributeName="stroke-width" values="1.25;2.5;1.25" dur="0.6s" begin="t2_0.end"/></rect>
  <text x="500" y="553" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">peso em gramas</text>

  <!-- pontos: percorrem os conectores em sequência e descansam 1 s -->
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t0_0" dur="2.60s" begin="0.4s; t2_0.end+1s"><mpath href="#a-foto-ajuste"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.60s" begin="t0_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t0_1" dur="2.60s" begin="0.4s; t2_0.end+1s"><mpath href="#a-foto-congelada"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.60s" begin="t0_1.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t1_0" dur="0.96s" begin="t0_0.end"><mpath href="#a-congelada-ridge"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t1_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t1_1" dur="0.96s" begin="t0_0.end"><mpath href="#a-ajuste-saida"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t1_1.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t2_0" dur="2.62s" begin="t1_0.end"><mpath href="#a-saida-peso"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.62s" begin="t2_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t2_1" dur="2.62s" begin="t1_0.end"><mpath href="#a-ridge-peso"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.62s" begin="t2_1.begin"/>
  </circle>

</svg>
