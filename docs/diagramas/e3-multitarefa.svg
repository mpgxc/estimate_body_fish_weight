<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 608" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">

  <style>
    .flow { fill: none; stroke-width: 1.5; stroke-dasharray: 4 14; animation: flow 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } .token { display: none; } }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#a8a29a"/></marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#7a7a82"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#1a9970"/></marker>
    <marker id="arrow-coral" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#b5432a"/></marker>
  </defs>

  <rect width="1000" height="608" fill="#ffffff"/>

  <text x="500" y="44" fill="#8a8a8a" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.12em" style="text-transform:uppercase">E3 · multitarefa</text>

  <!-- conectores -->
  <path id="a-foto-rede" d="M 400 136 L 400 208" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-rede-aux" d="M 520 235 L 680 235" stroke="#7a7a82" stroke-width="1.25" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-dash)"/>
  <path id="a-aux-rede" d="M 680 253 L 520 253" stroke="#7a7a82" stroke-width="1.25" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-dash)"/>
  <path id="a-rede-saida" d="M 400 280 L 400 368" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-saida-peso" d="M 400 440 L 400 512" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- fluxo (para 8 px antes da ponta) -->
  <path class="flow" d="M 400 136 L 400 200" stroke="#7a7a82"/>
  <path class="flow" d="M 400 280 L 400 360" stroke="#7a7a82"/>
  <path class="flow" d="M 400 440 L 400 504" stroke="#7a7a82"/>

  <!-- rótulos das setas -->
  <rect x="557.4" y="212" width="85.2" height="15" fill="#ffffff"/>
  <text x="600" y="223" fill="#8a8a8a" font-size="11" text-anchor="middle">prevê também</text>
  <rect x="517.75" y="261" width="164.5" height="15" fill="#ffffff"/>
  <text x="600" y="272" fill="#8a8a8a" font-size="11" text-anchor="middle">o erro volta só no treino</text>

  <!-- blocos -->
  <rect x="280" y="80" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="280" y="80" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="400" y="113" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">foto</text>

  <rect x="280" y="208" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="280" y="208" width="240" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"><animate attributeName="stroke-width" values="1.25;2.5;1.25" dur="0.6s" begin="t0_0.end"/></rect>
  <text x="400" y="240" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">rede em ajuste fino</text>
  <text x="400" y="258" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">a melhor do E2</text>

  <rect x="680" y="208" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="680" y="208" width="240" height="72" rx="10" fill="#faede7" stroke="#e0b3a0" stroke-width="1.25"/>
  <text x="800" y="240" fill="#9a4a30" font-size="15" font-weight="500" text-anchor="middle">saídas auxiliares</text>
  <text x="800" y="258" fill="#b85e40" font-size="11" font-weight="500" text-anchor="middle">espécie · comprimento e largura</text>

  <rect x="280" y="368" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="280" y="368" width="240" height="72" rx="10" fill="#e7f1fb" stroke="#a8c8e8" stroke-width="1.25"/>
  <text x="400" y="400" fill="#2a5580" font-size="15" font-weight="500" text-anchor="middle">saída de peso</text>
  <text x="400" y="418" fill="#3a70a8" font-size="11" font-weight="500" text-anchor="middle">a única usada na predição</text>

  <rect x="280" y="512" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="280" y="512" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="400" y="545" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">peso em gramas</text>

  <!-- pontos: percorrem os conectores em sequência e descansam 1 s -->
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t0_0" dur="0.96s" begin="0.4s; t4_0.end+1s"><mpath href="#a-foto-rede"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t0_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#7a7a82" opacity="0">
    <animateMotion id="t1_0" dur="2.13s" begin="t0_0.end"><mpath href="#a-rede-aux"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.13s" begin="t1_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#7a7a82" opacity="0">
    <animateMotion id="t2_0" dur="2.13s" begin="t1_0.end"><mpath href="#a-aux-rede"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.13s" begin="t2_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t3_0" dur="1.17s" begin="t2_0.end"><mpath href="#a-rede-saida"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.17s" begin="t3_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t4_0" dur="0.96s" begin="t3_0.end"><mpath href="#a-saida-peso"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t4_0.begin"/>
  </circle>

</svg>
