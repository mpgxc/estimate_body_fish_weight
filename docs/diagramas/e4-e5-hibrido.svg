<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">

  <style>
    .flow { fill: none; stroke-width: 1.5; stroke-dasharray: 4 14; animation: flow 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } .token { display: none; } }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#a8a29a"/></marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#7a7a82"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#1a9970"/></marker>
    <marker id="arrow-coral" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#b5432a"/></marker>
  </defs>

  <rect width="1000" height="632" fill="#ffffff"/>

  <text x="500" y="44" fill="#8a8a8a" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.12em" style="text-transform:uppercase">E4 e E5 · híbrido</text>

  <!-- conectores -->
  <path id="a-foto-medidas" d="M 380 108 C 300 108, 250 140, 250 216" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-foto-rede" d="M 620 108 C 700 108, 750 140, 750 216" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-medidas-fusao" d="M 250 288 C 250 340, 450 320, 450 376" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-rede-fusao" d="M 750 288 C 750 340, 550 320, 550 376" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-fusao-peso" d="M 500 448 L 500 536" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-fusao-especie" d="M 630 412 L 730 412" stroke="#7a7a82" stroke-width="1.25" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-dash)"/>

  <!-- fluxo (para 8 px antes da ponta) -->
  <path class="flow" d="M 500 448 L 500 528" stroke="#7a7a82"/>

  <!-- rótulos das setas -->
  <rect x="649.6" y="389" width="60.8" height="15" fill="#ffffff"/>
  <text x="680" y="400" fill="#8a8a8a" font-size="11" text-anchor="middle">só no E5</text>

  <!-- blocos -->
  <rect x="380" y="80" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="380" y="80" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="500" y="113" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">foto</text>

  <rect x="120" y="216" width="260" height="72" rx="10" fill="#ffffff"/>
  <rect x="120" y="216" width="260" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="250" y="248" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">U-Net + 12 medidas</text>
  <text x="250" y="266" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">forma e tamanho do corpo</text>

  <rect x="620" y="216" width="260" height="72" rx="10" fill="#ffffff"/>
  <rect x="620" y="216" width="260" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="750" y="248" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">rede de visão</text>
  <text x="750" y="266" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">vetor da foto</text>

  <rect x="370" y="376" width="260" height="72" rx="10" fill="#ffffff"/>
  <rect x="370" y="376" width="260" height="72" rx="10" fill="#e7f1fb" stroke="#a8c8e8" stroke-width="1.25"><animate attributeName="stroke-width" values="1.25;2.5;1.25" dur="0.6s" begin="t1_0.end"/></rect>
  <text x="500" y="408" fill="#2a5580" font-size="15" font-weight="500" text-anchor="middle">fusão</text>
  <text x="500" y="426" fill="#3a70a8" font-size="11" font-weight="500" text-anchor="middle">os dois juntos numa só entrada</text>

  <rect x="730" y="376" width="200" height="72" rx="10" fill="#ffffff"/>
  <rect x="730" y="376" width="200" height="72" rx="10" fill="#faede7" stroke="#e0b3a0" stroke-width="1.25"/>
  <text x="830" y="408" fill="#9a4a30" font-size="15" font-weight="500" text-anchor="middle">espécie</text>
  <text x="830" y="426" fill="#b85e40" font-size="11" font-weight="500" text-anchor="middle">saída auxiliar de treino</text>

  <rect x="380" y="536" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="380" y="536" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="500" y="569" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">peso em gramas</text>

  <!-- pontos: percorrem os conectores em sequência e descansam 1 s -->
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t0_0" dur="2.57s" begin="0.4s; t2_0.end+1s"><mpath href="#a-foto-medidas"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.57s" begin="t0_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t0_1" dur="2.57s" begin="0.4s; t2_0.end+1s"><mpath href="#a-foto-rede"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.57s" begin="t0_1.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t1_0" dur="3.09s" begin="t0_0.end"><mpath href="#a-medidas-fusao"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.09s" begin="t1_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t1_1" dur="3.09s" begin="t0_0.end"><mpath href="#a-rede-fusao"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.09s" begin="t1_1.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#7a7a82" opacity="0">
    <animateMotion id="t2_0" dur="1.33s" begin="t1_0.end"><mpath href="#a-fusao-especie"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.33s" begin="t2_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t2_1" dur="1.17s" begin="t1_0.end"><mpath href="#a-fusao-peso"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.17s" begin="t2_1.begin"/>
  </circle>

</svg>
