<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 744" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">

  <style>
    .flow { fill: none; stroke-width: 1.5; stroke-dasharray: 4 14; animation: flow 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } .token { display: none; } }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#a8a29a"/></marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#7a7a82"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#1a9970"/></marker>
    <marker id="arrow-coral" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#b5432a"/></marker>
  </defs>

  <rect width="1000" height="744" fill="#ffffff"/>

  <text x="500" y="44" fill="#8a8a8a" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.12em" style="text-transform:uppercase">F1 e F2 · o que o dataset público acrescenta</text>

  <!-- conectores -->
  <path id="a-fdwe-pre" d="M 420 136 L 420 208" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-pre-ajuste" d="M 420 280 L 420 352" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-coleta-ajuste" d="M 700 388 L 540 388" stroke="#7a7a82" stroke-width="1.25" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-dash)"/>
  <path id="a-ajuste-teste" d="M 420 424 L 420 496" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-teste-fim" d="M 420 568 L 420 648" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-f2" d="M 300 244 C 120 260, 120 520, 300 532" stroke="#b5432a" stroke-width="2" fill="none" marker-end="url(#arrow-coral)"/>

  <!-- fluxo (para 8 px antes da ponta) -->
  <path class="flow" d="M 420 136 L 420 200" stroke="#7a7a82"/>
  <path class="flow" d="M 420 280 L 420 344" stroke="#7a7a82"/>
  <path class="flow" d="M 420 424 L 420 488" stroke="#7a7a82"/>
  <path class="flow" d="M 420 568 L 420 640" stroke="#7a7a82"/>

  <!-- rótulos das setas -->
  <rect x="427.1" y="309" width="121.8" height="15" fill="#ffffff"/>
  <text x="488" y="320" fill="#8a8a8a" font-size="11" text-anchor="middle">só o corpo da rede</text>
  <rect x="568.25" y="365" width="103.5" height="15" fill="#ffffff"/>
  <text x="620" y="376" fill="#8a8a8a" font-size="11" text-anchor="middle">treino da dobra</text>
  <rect x="64.45" y="369" width="79.1" height="15" fill="#ffffff"/>
  <text x="104" y="380" fill="#b5432a" font-size="11" font-weight="600" text-anchor="middle">F2: direto,</text>
  <rect x="67.5" y="385" width="73" height="15" fill="#ffffff"/>
  <text x="104" y="396" fill="#b5432a" font-size="11" font-weight="600" text-anchor="middle">sem ajuste</text>

  <!-- blocos -->
  <rect x="300" y="80" width="240" height="56" rx="28" fill="#ffffff"/>
  <rect x="300" y="80" width="240" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="420" y="113" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">peixes do FDWE</text>

  <rect x="300" y="208" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="300" y="208" width="240" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="420" y="240" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">pré-treino</text>
  <text x="420" y="258" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">a rede aprende peso no FDWE</text>

  <rect x="300" y="352" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="300" y="352" width="240" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="420" y="384" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">ajuste fino</text>
  <text x="420" y="402" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">continua nas fotos da coleta</text>

  <rect x="700" y="352" width="220" height="72" rx="10" fill="#ffffff"/>
  <rect x="700" y="352" width="220" height="72" rx="10" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="810" y="384" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">fotos da coleta</text>
  <text x="810" y="402" fill="#8a8577" font-size="11" font-weight="500" text-anchor="middle">244 peixes</text>

  <rect x="300" y="496" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="300" y="496" width="240" height="72" rx="10" fill="#e1f4ee" stroke="#9dd3c2" stroke-width="1.25"><animate attributeName="stroke-width" values="1.25;2.5;1.25" dur="0.6s" begin="t2_0.end"/></rect>
  <text x="420" y="528" fill="#1f6a56" font-size="15" font-weight="500" text-anchor="middle">teste na coleta</text>
  <text x="420" y="546" fill="#2f8a72" font-size="11" font-weight="500" text-anchor="middle">mesmas dobras do E2</text>

  <rect x="280" y="648" width="280" height="56" rx="28" fill="#ffffff"/>
  <rect x="280" y="648" width="280" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="420" y="681" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">F1: o pré-treino ajudou?</text>

  <!-- pontos: percorrem os conectores em sequência e descansam 1 s -->
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t0_0" dur="0.96s" begin="0.4s; t4_0.end+1s"><mpath href="#a-fdwe-pre"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t0_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#7a7a82" opacity="0">
    <animateMotion id="t1_0" dur="2.13s" begin="t0_0.end"><mpath href="#a-coleta-ajuste"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.13s" begin="t1_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t1_1" dur="0.96s" begin="t0_0.end"><mpath href="#a-pre-ajuste"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t1_1.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t2_0" dur="0.96s" begin="t1_0.end"><mpath href="#a-ajuste-teste"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t2_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#b5432a" opacity="0">
    <animateMotion id="t3_0" dur="5.83s" begin="t2_0.end"><mpath href="#a-f2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="5.83s" begin="t3_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t4_0" dur="1.07s" begin="t3_0.end"><mpath href="#a-teste-fim"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="1.07s" begin="t4_0.begin"/>
  </circle>

</svg>
