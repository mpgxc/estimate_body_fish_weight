<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 712" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">

  <style>
    .flow { fill: none; stroke-width: 1.5; stroke-dasharray: 4 14; animation: flow 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } .token { display: none; } }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#a8a29a"/></marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#7a7a82"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#1a9970"/></marker>
    <marker id="arrow-coral" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#b5432a"/></marker>
  </defs>

  <rect width="1000" height="712" fill="#ffffff"/>

  <text x="500" y="44" fill="#8a8a8a" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.12em" style="text-transform:uppercase">segmentação: a rede nunca viu a foto que segmenta</text>

  <!-- escopos -->
  <rect x="220" y="176" width="700" height="272" rx="12" fill="none" stroke="#8b7fd4" stroke-width="1.25" stroke-dasharray="6,5"/>
  <rect x="680" y="168" width="211.6" height="16" fill="#ffffff"/>
  <text x="684" y="180" fill="#8b7fd4" font-size="11" font-weight="600">uma rede por dobra · 21 no total</text>

  <!-- conectores -->
  <path id="a-treino-unet" d="M 380 136 L 380 208" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-teste-unet" d="M 660 244 L 500 244" stroke="#7a7a82" stroke-width="1.25" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-dash)"/>
  <path id="a-unet-mascara" d="M 380 280 L 380 352" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-mascara-dice" d="M 500 384 L 660 384" stroke="#7a7a82" stroke-width="1.25" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-dash)"/>
  <path id="a-mascara-medidas" d="M 380 416 L 380 480" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="a-medidas-saida" d="M 380 552 L 380 616" stroke="#a8a29a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- fluxo (para 8 px antes da ponta) -->
  <path class="flow" d="M 380 136 L 380 200" stroke="#7a7a82"/>
  <path class="flow" d="M 380 280 L 380 344" stroke="#7a7a82"/>
  <path class="flow" d="M 380 416 L 380 472" stroke="#7a7a82"/>
  <path class="flow" d="M 380 552 L 380 608" stroke="#7a7a82"/>

  <!-- rótulos das setas -->
  <rect x="531.3" y="221" width="97.4" height="15" fill="#ffffff"/>
  <text x="580" y="232" fill="#8a8a8a" font-size="11" text-anchor="middle">só para prever</text>
  <rect x="552.65" y="361" width="54.7" height="15" fill="#ffffff"/>
  <text x="580" y="372" fill="#8a8a8a" font-size="11" text-anchor="middle">compara</text>

  <!-- blocos -->
  <rect x="240" y="80" width="280" height="56" rx="28" fill="#ffffff"/>
  <rect x="240" y="80" width="280" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="380" y="113" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">fotos e máscaras de treino</text>

  <rect x="260" y="208" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="260" y="208" width="240" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"><animate attributeName="stroke-width" values="1.25;2.5;1.25" dur="0.6s" begin="t1_0.end"/></rect>
  <text x="380" y="240" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">U-Net</text>
  <text x="380" y="258" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">MobileNetV2 · 20 épocas</text>

  <rect x="660" y="208" width="220" height="72" rx="10" fill="#ffffff"/>
  <rect x="660" y="208" width="220" height="72" rx="10" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="770" y="240" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">foto de teste</text>
  <text x="770" y="258" fill="#8a8577" font-size="11" font-weight="500" text-anchor="middle">fora do treino da dobra</text>

  <rect x="260" y="352" width="240" height="64" rx="10" fill="#ffffff"/>
  <rect x="260" y="352" width="240" height="64" rx="10" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="380" y="389" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">máscara prevista</text>

  <rect x="660" y="348" width="220" height="72" rx="10" fill="#ffffff"/>
  <rect x="660" y="348" width="220" height="72" rx="10" fill="#e1f4ee" stroke="#9dd3c2" stroke-width="1.25"/>
  <text x="770" y="380" fill="#1f6a56" font-size="15" font-weight="500" text-anchor="middle">Dice · IoU</text>
  <text x="770" y="398" fill="#2f8a72" font-size="11" font-weight="500" text-anchor="middle">contra a máscara manual</text>

  <rect x="260" y="480" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="260" y="480" width="240" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="380" y="512" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">12 medidas</text>
  <text x="380" y="530" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">área · eixos · perímetro</text>

  <rect x="240" y="616" width="280" height="56" rx="28" fill="#ffffff"/>
  <rect x="240" y="616" width="280" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="380" y="649" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">medidas do peixe de teste</text>

  <!-- pontos: percorrem os conectores em sequência e descansam 1 s -->
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t0_0" dur="0.96s" begin="0.4s; t4_0.end+1s"><mpath href="#a-treino-unet"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t0_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#7a7a82" opacity="0">
    <animateMotion id="t1_0" dur="2.13s" begin="t0_0.end"><mpath href="#a-teste-unet"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.13s" begin="t1_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t2_0" dur="0.96s" begin="t1_0.end"><mpath href="#a-unet-mascara"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.96s" begin="t2_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#7a7a82" opacity="0">
    <animateMotion id="t3_0" dur="2.13s" begin="t2_0.end"><mpath href="#a-mascara-dice"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.13s" begin="t3_0.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t3_1" dur="0.90s" begin="t2_0.end"><mpath href="#a-mascara-medidas"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.90s" begin="t3_1.begin"/>
  </circle>
  <circle class="token" r="3.5" fill="#6a63b0" opacity="0">
    <animateMotion id="t4_0" dur="0.90s" begin="t3_0.end"><mpath href="#a-medidas-saida"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="0.90s" begin="t4_0.begin"/>
  </circle>

</svg>
