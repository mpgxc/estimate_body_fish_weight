[project]
name = "fishweight"
version = "0.1.0"
description = "Estimativa de peso de peixes a partir de uma foto"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas>=2.0",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "joblib",
  "pillow",
  # Pisos baixos de propósito: Kaggle e Colab já trazem o PyTorch com CUDA
  # instalado, e um piso alto forçaria baixar tudo de novo.
  "torch>=2.2",
  "timm>=0.9.12",
  "segmentation-models-pytorch>=0.3.3",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fishweight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: treina redes pequenas em CPU (cerca de 20 s); pule com -m 'not slow'"]
