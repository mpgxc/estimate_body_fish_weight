[project]
name = "fishweight"
version = "0.1.0"
description = "Estimativa de peso de peixes a partir de uma foto"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "pandas>=2.0",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "scipy",
  "joblib",
  "tqdm",
  "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fishweight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
